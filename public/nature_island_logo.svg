<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Deep forest green background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0d350b" />
      <stop offset="100%" stop-color="#072206" />
    </radialGradient>

    <!-- Sunburst rays gradient -->
    <linearGradient id="sunRaysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF04D" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Sun core glow gradient -->
    <radialGradient id="sunCoreGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFF4D" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Sun rim highlight -->
    <linearGradient id="sunRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Leaf body gradient (left & right) -->
    <linearGradient id="leafBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="55%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Lower leaf gradient -->
    <linearGradient id="lowerLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Light green stem & outline gradient -->
    <linearGradient id="leafOutlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="36" fill="url(#bgGrad)" />

  <!-- EMBLEM GROUP -->
  <g transform="translate(0, -10)">
    <!-- 7 Pointed Rising Sun Rays + Sun Dome -->
    <path
      d="
        M 326 258
        L 264 212
        L 346 232
        L 296 164
        L 363 213
        L 343 136
        L 385 204
        L 400 120
        L 415 204
        L 457 136
        L 437 213
        L 504 164
        L 454 232
        L 536 212
        L 474 258
        Z
      "
      fill="url(#sunRaysGrad)"
      stroke="url(#sunRimGrad)"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Inner Glowing Sun Core -->
    <ellipse cx="400" cy="262" rx="58" ry="44" fill="url(#sunCoreGrad)" />
    <path
      d="M 350 245 Q 400 225 450 245 Q 422 276 400 330 Q 378 276 350 245 Z"
      fill="url(#sunCoreGrad)"
    />

    <!-- LEFT LARGE LEAF -->
    <path
      d="
        M 394 338
        C 386 286, 355 252, 300 248
        C 258 245, 232 238, 216 218
        C 220 264, 236 306, 278 314
        C 324 322, 362 320, 388 345
        Z
      "
      fill="url(#leafBodyGrad)"
      stroke="url(#leafOutlineGrad)"
      stroke-width="5.5"
      stroke-linejoin="round"
    />

    <!-- Left Leaf Inner Vein -->
    <path
      d="M 390 340 C 374 300, 336 278, 268 276"
      fill="none"
      stroke="url(#leafOutlineGrad)"
      stroke-width="6.5"
      stroke-linecap="round"
    />

    <!-- RIGHT LARGE LEAF -->
    <path
      d="
        M 406 338
        C 414 286, 445 252, 500 248
        C 542 245, 568 238, 584 218
        C 580 264, 564 306, 522 314
        C 476 322, 438 320, 412 345
        Z
      "
      fill="url(#leafBodyGrad)"
      stroke="url(#leafOutlineGrad)"
      stroke-width="5.5"
      stroke-linejoin="round"
    />

    <!-- Right Leaf Inner Vein -->
    <path
      d="M 410 340 C 426 300, 464 278, 532 276"
      fill="none"
      stroke="url(#leafOutlineGrad)"
      stroke-width="6.5"
      stroke-linecap="round"
    />

    <!-- LOWER LEFT SMALL LEAF -->
    <path
      d="
        M 392 346
        C 365 326, 326 328, 298 344
        C 320 364, 356 352, 392 354
        Z
      "
      fill="url(#lowerLeafGrad)"
      stroke="url(#leafOutlineGrad)"
      stroke-width="5.5"
      stroke-linejoin="round"
    />
    <path
      d="M 388 349 C 362 338, 336 340, 314 346"
      fill="none"
      stroke="url(#leafOutlineGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- LOWER RIGHT SMALL LEAF -->
    <path
      d="
        M 408 346
        C 435 326, 474 328, 502 344
        C 480 364, 444 352, 408 354
        Z
      "
      fill="url(#lowerLeafGrad)"
      stroke="url(#leafOutlineGrad)"
      stroke-width="5.5"
      stroke-linejoin="round"
    />
    <path
      d="M 412 349 C 438 338, 464 340, 486 346"
      fill="none"
      stroke="url(#leafOutlineGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- CENTRAL STEM BASE -->
    <path
      d="M 392 332 L 391 364 Q 400 370 409 364 L 408 332 Z"
      fill="url(#leafOutlineGrad)"
    />
  </g>

  <!-- TYPOGRAPHY: NATURE ISLAND -->
  <text
    x="400"
    y="445"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="64"
    font-weight="900"
    letter-spacing="1.5"
  >
    NATURE ISLAND
  </text>

  <!-- TYPOGRAPHY: C A R E E R S -->
  <text
    x="406"
    y="498"
    text-anchor="middle"
    fill="#5BC22B"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="33"
    font-weight="800"
    letter-spacing="14"
  >
    CAREERS
  </text>
</svg>
